<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: transparent; font-family: sans-serif; overflow: hidden; }
        .message-input-area { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        textarea { width: 350px; height: 50px; padding: 10px; border: 2px solid #000; border-radius: 5px; resize: none; font-family: monospace; }
        .status-container { display: flex; align-items: center; justify-content: flex-end; height: 60px; width: 100%; max-width: 400px; }
        #msg-status { font-weight: bold; font-family: monospace; color: white; margin-right: 15px; white-space: nowrap; }
        .msg-submit { background-color: darkblue; color: wheat; font-weight: bold; cursor: pointer; border-radius: 5px; border: none; padding: 10px 20px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="message-input-area">
        <textarea id="msg-input" placeholder="or send music idk"></textarea>
        <div class="status-container">
            <span id="msg-status"></span>
            <button class="msg-submit">Tell me something</button>                              
        </div>
    </div>
    <script src="../config.js"></script>
    <script src="../messages.js"></script>
</body>
</html>
