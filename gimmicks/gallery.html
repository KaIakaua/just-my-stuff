<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery of those drawings sent to me</title>
    <meta name="referrer" content="no-referrer">
    <style>
        body {
            background-image: url(Background.gif);
            background-size: cover;
        }
        h1, p {
            text-align: center;
        }
        h1 {
            color: #ffffff;
        }
        a {
            color: #ffcc00;
        }
        #home-button {
            position: fixed; 
            top: 20px;
            left: 20px;
            border-radius: 50%; /* Makes it a circle */
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6e1a;
            text-decoration: none;
            opacity: 1;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #home-button:hover {
            background: #000c79;
            color: white;
            transform: scale(1.1);
        }
        #home-button svg {
            width: 50px;
            height: auto;
            fill: currentColor; 
        }
        .image-container > p, .image-container > img {
            border: solid 2px black;
        }
        /* Basic styling so the images aren't huge */
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .image-container {
            border: 2px solid #3882f6;
            padding: 10px;
            background: white;
            text-align: center;
            cursor: pointer;
        }
        .image-container img {
            max-width: 250px;
            display: block;
        }
        #lightbox {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #lightbox-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: 3px solid white;
            border-radius: 5px;
            transition: transform 0.3s ease;
            cursor: zoom-in;
        }
        #lightbox.is-zoomed #lightbox-img {
            transform: scale(1.5);
            cursor: zoom-out;
        }
    </style>
</head>
<body>
    <a href="../index.html" id="home-button" title="Back to Home">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
    </a>

    <p id="status"></p>

	
    <h1>Submitted Drawings ☻</h1>
    <p><a href="https://www.deviantart.com/firstdarkangel2001/art/Animated-Star-Background-Stock-649474574">Background source</a></p>

    <div id="gallery">Loading images...</div>
    
    <div id="lightbox">
        <img id="lightbox-img">
    </div>

    <script src="../drawbox.js"></script>

</body>
</html>
