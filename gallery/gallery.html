<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery of those drawings sent to me</title>
    <meta name="referrer" content="no-referrer">
    <style>
        body {
            background-image: url(Background.gif);
            background-size: cover;
        }
        h1, p {
            text-align: center;
        }
        h1 {
            color: #ffffff;
        }
        a {
            color: #ffcc00;
        }
        .image-container > p, .image-container > img {
            border: solid 2px black;
        }
        /* Basic styling so the images aren't huge */
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .image-container {
            border: 2px solid #3882f6;
            padding: 10px;
            background: white;
            text-align: center;
            cursor: pointer;
        }
        .image-container img {
            max-width: 250px;
            display: block;
        }
        #lightbox {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #lightbox-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: 3px solid white;
            border-radius: 5px;
            transition: transform 0.3s ease;
            cursor: zoom-in;
        }
        #lightbox.is-zoomed #lightbox-img {
            transform: scale(1.5);
            cursor: zoom-out;
        }
    </style>
</head>
<body>
    <p id="status"></p>

	
    <h1>Submitted Drawings ☻</h1>
    <p><a href="https://www.deviantart.com/firstdarkangel2001/art/Animated-Star-Background-Stock-649474574">Background source</a></p>

    <div id="gallery">Loading images...</div>
    
    <div id="lightbox">
        <img id="lightbox-img">
    </div>

    <script src="/drawbox.js"></script>

</body>
</html>
